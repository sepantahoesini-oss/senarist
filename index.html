body{background:radial-gradient(ellipse at 48% -10%,#20324a 0,#0a1320 48%,#060c15 100%)}
.heroart{background-image:linear-gradient(90deg,#07101c55,#07101cbb),var(--hero-art);background-size:cover;background-position:center;min-height:310px;border-color:#405570;box-shadow:0 22px 55px #0006}
.heroart .crest{font-size:68px;text-shadow:0 8px 30px #000}
.cover{background-image:linear-gradient(180deg,#0b142030,#07111ee8),var(--hero-art);background-size:cover;background-position:center 44%}
.scenario{box-shadow:0 14px 35px #0003}
.scenario:hover{box-shadow:0 18px 42px #0005}
.author-chip{display:inline-flex;align-items:center;gap:9px;cursor:pointer;border:1px solid #344a64;background:#0b1727;border-radius:14px;padding:8px 12px;color:#e4edf7;text-align:right}
.author-chip:hover,.profile-link:hover{border-color:#87a8ce;background:#15253a}
.avatar-art{display:inline-grid;place-items:center;flex-shrink:0;border-radius:50%;border:1px solid #6f89a8;background:radial-gradient(circle at 30% 25%,#526e8b,#17263b 66%,#09111e);box-shadow:inset 0 0 0 3px #0a1421,0 4px 12px #0005;overflow:hidden}
.avatar-art{position:relative;background:#101b2a;isolation:isolate}.avatar-art svg{display:block;width:100%;height:100%;object-fit:cover}.avatar-choice .avatar-art{width:56px;height:56px;font-size:0}.profile-hero .avatar-art{width:76px;height:76px;font-size:0}.profile-portrait{width:92px;height:92px;border-radius:50%;overflow:hidden;border:2px solid #7e9fc3;box-shadow:0 0 0 5px #20354d,0 10px 25px #0007}.profile-portrait svg{width:100%;height:100%;display:block}.avatar-choice small{font-size:10px;color:#8fa7c2;line-height:1.4}
.avatar-choice-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.avatar-choice{border:1px solid #2d425b;background:linear-gradient(145deg,#14243a,#0d1727);border-radius:15px;padding:14px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px;min-height:125px}
.avatar-choice.selected{border-color:#9abce3;box-shadow:0 0 0 2px #8db6e42a;background:linear-gradient(145deg,#213954,#101b2d)}
.avatar-choice .avatar-art{width:56px;height:56px;font-size:29px}
.scenario-author-panel{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(115deg,#14263b,#0b1524);border:1px solid #304761;border-radius:16px;padding:13px;margin:14px 0}
.scenario-detail-hero{position:relative;overflow:hidden;border:1px solid #304761;border-radius:16px;padding:22px;background-image:linear-gradient(90deg,#07101bd9,#0b1625a8),var(--hero-art);background-size:cover;background-position:center;min-height:170px}
.scenario-detail-hero h2{font-size:clamp(22px,4vw,32px);margin:8px 0}
.team-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}
.team-tabs button{background:#101c2d;border:1px solid #2b405b;color:#b8c9dd}
.team-tabs button.active{background:linear-gradient(135deg,#2a4564,#182a40);border-color:#8baed4;color:#f2f7ff;box-shadow:inset 0 -2px #9fc0e5}

<body><div class="top"><div class="wrap nav"><div class="brand"><div class="logo">✒</div><div>سناریست<small>S E N A R I S T</small></div></div><div class="navlinks" id="navlinks"><button class="active" data-page="home">خانه</button><button data-page="discover">سناریوها</button><button data-page="create">ساخت سناریو</button><button data-page="shop">خرید مجوز</button><button data-page="mine">سناریوهای من</button><button data-page="ranking">رتبه‌بندی</button><button data-page="messages">پیام‌ها <span id="unreadCount"></span></button><button data-page="profile">پروفایل</button><button data-page="admin" id="adminNav" class="hidden">پنل مدیریت</button></div><div class="userbox"><div class="avatar" id="navAvatar">م</div><span class="username" id="navName">مهمان</span><button class="secondary small" id="authButton">ورود</button></div></div></div>
<main class="wrap" id="app"></main><footer class="footer"><div class="wrap row between"><span>سناریست · انجمن سازندگان سناریوهای مافیا</span><span>انجمن سناریوسازان مافیا</span></div></footer><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{'use strict';
const KEY='senarist_v1';
const initial=()=>({currentUser:null,users:[{id:'u_admin',phone:'09120000000',password:'admin123',displayName:'مدیر اصلی',role:'owner',approved:true,forcePasswordChange:false,createdAt:Date.now(),credits:99,likesEarned:0,followers:0,following:[],liked:[],viewed:[],messages:[{id:'m0',title:'به سناریست خوش آمدی',body:'به انجمن سناریست خوش آمدی.',date:Date.now(),read:false}]}],requests:[],scenarios:[{id:'s1',title:'آخرین قطار شب',authorId:'u_admin',authorName:'مدیر اصلی',description:'در ایستگاه متروکه، هیچ‌کس آن کسی نیست که ادعا می‌کند.',players:10,teams:[{key:'citizens',name:'شهروندان',roles:[{name:'کارآگاه',description:'هر شب یک نفر را بررسی می‌کند.'},{name:'پزشک',description:'هر شب می‌تواند از یک بازیکن محافظت کند.'},{name:'شهروند ساده',description:'با تحلیل و گفت‌وگو شهر را نجات دهید.'},{name:'خبرنگار',description:'یک سرنخ عمومی در طول بازی به دست می‌آورد.'},{name:'محافظ',description:'از بازیکنی که انتخاب می‌کند محافظت می‌کند.'},{name:'شهروند ساده ۲',description:'با شهروندان برای شناسایی مافیا همکاری می‌کند.'}]},{key:'mafia',name:'مافیا',roles:[{name:'پدرخوانده',description:'رهبر گروه مافیاست و در بررسی‌ها پنهان می‌ماند.'},{name:'مافیای ساده',description:'با گروه مافیا برای حذف شهروندان همکاری می‌کند.'},{name:'مذاکره‌کننده',description:'می‌تواند در شرایط مشخص با شهر مذاکره کند.'}]},{key:'independent',name:'مستقل',roles:[{name:'جوکر',description:'هدف ویژهٔ خودش را دنبال می‌کند.'}]}],status:'approved',likes:8,views:31,createdAt:Date.now()-86400000*3,featured:true,adminChoice:true,revision:1}],ranking:{active:false,period:0,startedAt:null,stoppedAt:null,results:[]},settings:{},audit:[],nextId:20});
const AVATARS=[{id:'free_shadow',name:'کارآگاه',cost:0,kind:0,desc:'تحلیل‌گر آرام و دقیق'},{id:'free_mask',name:'نقاب‌دار',cost:0,kind:1,desc:'چهره‌ای مرموز و ناشناس'},{id:'free_owl',name:'بانوی شب',cost:0,kind:2,desc:'استراتژیست باهوش'},{id:'premium_wolf',name:'گرگ شب',cost:2,kind:3,desc:'شکارچی بی‌رحم'},{id:'premium_crown',name:'تاج سیاه',cost:2,kind:4,desc:'رهبر دنیای زیرزمینی'},{id:'premium_phantom',name:'شبح',cost:3,kind:5,desc:'نفوذگر سایه‌ها'},{id:'premium_raven',name:'کلاغ',cost:3,kind:6,desc:'خبرچین افسانه‌ای'},{id:'premium_dragon',name:'اژدها',cost:4,kind:7,desc:'فرمانده‌ای خطرناک'}];
function ensureUserCosmetics(){db.users.forEach(u=>{if(!u.avatarId)u.avatarId='free_shadow';if(!Array.isArray(u.unlockedAvatars))u.unlockedAvatars=['free_shadow','free_mask','free_owl']})}
function avatarInfo(u){return AVATARS.find(a=>a.id===(u&&u.avatarId))||AVATARS[0]}
function avatarSvg(kind=0){const k=Number(kind)||0;const skin=['#d7a17c','#c98e69','#e0b091','#b87959','#d3a080','#b98268','#e2b89b','#9e684e'][k%8];const hair=['#171a20','#29201d','#21191a','#10151c','#30221c','#161a24','#2a211c','#17120f'][k%8];const coat=['#253a52','#151a23','#3b2630','#25302f','#2b2936','#172638','#2c3036','#3a2524'][k%8];const female=k===2||k===6;const hood=k===1||k===5;const beard=[0,3,4,6,7].includes(k);const eye=['#b8d0df','#9fb7c8','#4e3329','#a4b9c7','#6d8b92','#c0cbd3','#6e4b3c','#a3b3c1'][k%8];return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(AVATARS[k]?.name||'آواتار')}" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="bg${k}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${['#47617b','#26364b','#69454a','#315653','#67583d','#35485f','#604a3e','#653c3a'][k%8]}"/><stop offset="1" stop-color="#08111e"/></linearGradient><linearGradient id="face${k}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${skin}"/><stop offset="1" stop-color="#805544"/></linearGradient></defs><rect width="100" height="100" fill="url(#bg${k})"/><circle cx="50" cy="36" r="39" fill="#dbe9f8" opacity=".05"/><path d="M9 100 Q13 73 31 69 L69 69 Q88 77 92 100Z" fill="${coat}"/><path d="M37 65 L63 65 L68 78 L32 78Z" fill="#b7c4d0"/><path d="M43 62 L57 62 L57 73 L43 73Z" fill="url(#face${k})"/><path d="M28 36 Q27 12 50 12 Q75 13 72 39 L68 58 Q62 73 50 74 Q36 70 31 56Z" fill="url(#face${k})"/><path d="M27 39 Q19 14 43 8 Q69 3 76 28 L71 40 L65 25 Q48 33 32 27Z" fill="${hair}"/>${female?`<path d="M29 35 Q19 52 27 75 L17 83 Q12 47 21 26Z M70 31 Q82 48 75 75 L84 82 Q90 45 76 24Z" fill="${hair}"/>`:''}<path d="M35 43 Q42 39 46 43 M55 43 Q61 39 66 43" stroke="${hair}" stroke-width="3" stroke-linecap="round" fill="none"/><ellipse cx="41" cy="47" rx="3.1" ry="2" fill="${eye}"/><ellipse cx="60" cy="47" rx="3.1" ry="2" fill="${eye}"/><circle cx="41" cy="47" r="1.1" fill="#101722"/><circle cx="60" cy="47" r="1.1" fill="#101722"/><path d="M50 47 L47 56 L52 57" stroke="#70483a" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M43 62 Q50 66 58 61" stroke="#502d2c" stroke-width="2" fill="none" stroke-linecap="round"/>${beard?`<path d="M31 54 Q36 61 43 61 Q50 68 58 61 Q66 61 69 53 L65 67 Q58 76 49 75 Q39 73 34 66Z" fill="${hair}"/>`:''}${hood?`<path d="M22 40 Q18 4 50 3 Q83 4 78 40 L68 31 L64 18 Q48 26 34 18 L31 33Z" fill="#080d16" stroke="#61768c" stroke-width="1.5"/>`:''}<path d="M31 79 L43 72 L50 84 L57 72 L69 79 L76 100 L24 100Z" fill="${coat}"/><path d="M43 73 L50 84 L57 73" fill="none" stroke="#8da4bb" stroke-width="1.2"/><path d="M4 88 L17 88 M83 88 L96 88" stroke="#9bb9d8" stroke-opacity=".4"/></svg>`}
function avatarHtml(u,size=44){const a=avatarInfo(u);return `<span class="avatar-art" style="width:${size}px;height:${size}px" title="${esc(a.name)}">${avatarSvg(a.kind)}</span>`}
function followersOf(uid){return db.users.filter(x=>(x.following||[]).includes(uid))}
let db=load();ensureUserCosmetics();let page='home',adminTab='overview',builder={title:'',description:'',players:10,teams:[{key:'citizens',name:'شهروندان',roles:[]},{key:'mafia',name:'مافیا',roles:[]},{key:'independent',name:'مستقل',roles:[]}]};let selectedScenario=null;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.users)return d}catch(e){}return initial()}
function save(){localStorage.setItem(KEY,JSON.stringify(db));updateHeader()}
function id(prefix='x'){return prefix+(db.nextId++)}
function me(){return db.users.find(u=>u.id===db.currentUser)||null}
function isAdmin(u=me()){return !!u&&['owner','admin'].includes(u.role)}
function isOwner(u=me()){return !!u&&u.role==='owner'}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function date(ts){return new Date(ts||Date.now()).toLocaleDateString('fa-IR',{year:'numeric',month:'short',day:'numeric'})}
function toast(s){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>root.innerHTML='',3000)}
function updateHeader(){const u=me();document.getElementById('navName').textContent=u?u.displayName||'تکمیل حساب':'مهمان';document.getElementById('navAvatar').innerHTML=u?avatarHtml(u,34):'؟';document.getElementById('authButton').textContent=u?'خروج':'ورود';document.getElementById('adminNav').classList.toggle('hidden',!isAdmin());document.getElementById('unreadCount').textContent=u&&u.messages.filter(m=>!m.read).length?`(${u.messages.filter(m=>!m.read).length})`:'';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function go(p){page=p;updateHeader();render()}
function requireUser(){if(!me()){authModal('login');return false}if(me().forcePasswordChange){go('profile');toast('ابتدا رمز اولیه را تغییر بده.');return false}if(!me().displayName){go('profile');toast('ابتدا نام نمایشی انتخاب کن.');return false}return true}
function scenarioById(sid){return db.scenarios.find(s=>s.id===sid)}
function getPublished(){return db.scenarios.filter(s=>s.status==='approved')}
function scenarioCard(s){const u=me(),liked=u&&u.liked.includes(s.id),viewed=u&&u.viewed.includes(s.id);return `<article class="scenario"><div class="cover"><span class="tag">${s.players} بازیکن</span><div class="symbol">${s.coverEmoji||'♟'}</div></div><div class="scenario-body"><h3>${esc(s.title)}</h3><div class="byline"><button class="author-chip" style="padding:5px 8px;border-radius:10px;font-size:11px" onclick="S.openProfile('${s.authorId}')">${avatarHtml(db.users.find(x=>x.id===s.authorId)||{avatarId:'free_shadow'},26)} <span>ناشر: ${esc((db.users.find(x=>x.id===s.authorId)?.displayName)||s.authorName||'سازنده')}</span></button></div><p class="desc">${esc(s.description||'سناریوی تازه‌ای برای علاقه‌مندان مافیا.')}</p><div class="chips">${s.teams.filter(t=>t.key!=='independent'||t.roles.length>0).map(t=>`<span class="chip">${esc(t.name)} · ${t.roles.length} نقش</span>`).join('')}</div><div class="cardfoot"><div class="metrics"><span>♡ ${s.likes||0}</span><span>◉ ${s.views||0}</span></div><div class="cardactions"><button class="likebtn ${liked?'liked':''}" onclick="window.S.like('${s.id}')">${liked?'♥ لایک‌شده':'♡ لایک'}</button><button class="secondary small" onclick="window.S.openScenario('${s.id}')">مشاهده</button></div></div></div></article>`}
function cardsList(arr,empty='هنوز سناریویی اینجا نیست.'){return arr.length?`<div class="cards">${arr.map(scenarioCard).join('')}</div>`:`<div class="panel empty">${empty}</div>`}
function sectionHead(title,sub,btn=''){return `<div class="sectionhead"><div><h2>${title}</h2><p>${sub}</p></div>${btn}</div>`}
function home(){const all=getPublished(),featured=all.filter(s=>s.featured).slice(0,3),newest=[...all].sort((a,b)=>b.createdAt-a.createdAt).slice(0,3),adminChoices=all.filter(s=>s.adminChoice).sort((a,b)=>b.likes-a.likes).slice(0,3);return `<section class="hero"><div><div class="eyebrow">MAFIA SCENARIO CREATORS COMMUNITY</div><h1>ایده‌ات رو بساز.<br><span>سناریوت رو ماندگار کن.</span></h1><p>سناریست، خانهٔ سناریوسازهای مافیاست؛ جایی برای ساخت نقش‌های تازه، انتشار ایده‌ها و رقابت با خلاق‌ترین سازنده‌ها.</p><div class="hero-actions"><button onclick="S.go('discover')">کشف سناریوها ←</button><button class="secondary" onclick="S.go('create')">＋ ساخت سناریو</button></div></div><div class="heroart"><div class="artsub">YOUR STORY. YOUR RULES.</div><div class="crest">♟</div><div class="artlabel">S E N A R I S T</div></div></section><div class="stats"><div class="stat"><strong>${db.users.filter(u=>u.approved).length}</strong><span>اعضای تأییدشده</span></div><div class="stat"><strong>${all.length}</strong><span>سناریوهای منتشرشده</span></div><div class="stat"><strong>${all.reduce((n,s)=>n+s.likes,0)}</strong><span>لایک‌های انجمن</span></div><div class="stat"><strong>${db.ranking.active?'فعال':'آماده شروع'}</strong><span>رتبه‌بندی ماهانه</span></div></div><section class="section">${sectionHead('سناریوهای منتخب','سه سناریویی که تیم مدیریت برجسته کرده است.','<button class="secondary small" onclick="S.go(\'discover\')">همه سناریوها</button>')}${cardsList(featured,'هنوز سناریوی منتخبی انتخاب نشده است.')}</section><section class="section">${sectionHead('جدیدترین سناریوها','تازه‌ترین سناریوهای تأییدشده در سناریست.','')}${cardsList(newest,'هنوز سناریویی منتشر نشده است.')}</section><section class="section">${sectionHead('انتخاب مدیران','سناریوهایی که حساب اصلی یا مدیران منتخب پسندیده‌اند.','')}${cardsList(adminChoices,'هنوز انتخاب مدیری ثبت نشده است.')}</section>`}
function discover(){const all=getPublished();return `<div class="page">${sectionHead('کشف سناریوها','ایده‌های تازه را پیدا کن، بررسی کن و به سازنده‌ها بازخورد بده.')}<div class="field"><input id="searchScenarios" placeholder="جست‌وجو بر اساس نام سناریو، سازنده یا نقش…" oninput="S.filterScenarios()"></div><div id="scenarioResults">${cardsList(all)}</div></div>`}
function roleEditor(team,ri,r){return `<div class="rolebox"><div class="row between"><h4>نقش ${ri+1}</h4><button class="danger small" onclick="S.removeRole('${team.key}',${ri})">حذف نقش</button></div><div class="field"><label>نام نقش</label><input value="${esc(r.name)}" maxlength="60" placeholder="مثلاً کارآگاه" oninput="S.roleChange('${team.key}',${ri},'name',this.value)"></div><div class="field"><label>توضیحات و توانایی نقش</label><textarea maxlength="1200" placeholder="توانایی‌ها، محدودیت‌ها و شرایط استفاده از نقش را بنویس…" oninput="S.roleChange('${team.key}',${ri},'description',this.value)">${esc(r.description)}</textarea></div></div>`}
function createPage(){if(!requireUser())return '';const u=me();return `<div class="page"><div class="sectionhead"><div><h2>ساخت سناریوی جدید</h2><p>هر نقش را خودت بساز؛ نام و توضیحاتش کاملاً با توست.</p></div><span class="pill">مجوزهای ساخت: ${u.credits}</span></div>${u.credits<=0?'<div class="notice warn">مجوز ساخت نداری. برای دریافت مجوز ساخت، با مدیران انجمن تماس بگیر.</div>':''}<div class="panel"><div class="field"><label>نام سناریو</label><input id="scenarioTitle" maxlength="100" value="${esc(builder.title)}" oninput="S.builderTitle(this.value)" placeholder="نام جذاب برای سناریوت"></div><div class="field"><label>معرفی کوتاه سناریو</label><textarea id="scenarioDesc" maxlength="500" oninput="S.builderDesc(this.value)" placeholder="فضا، ایده یا ویژگی خاص سناریو را معرفی کن…">${esc(builder.description)}</textarea></div><div class="field"><label>تعداد کل بازیکنان</label><select id="playerCount" onchange="S.builderPlayers(this.value)">${Array.from({length:13},(_,i)=>i+4).map(n=>`<option value="${n}" ${builder.players===n?'selected':''}>${n} بازیکن</option>`).join('')}</select></div><div class="notice">اول نام تیم را تعیین کن، بعد تمام نقش‌های همان تیم را به‌دلخواه بساز و برای هر نقش توضیحات بنویس. تعداد مجموع نقش‌ها باید دقیقاً برابر بازیکنان باشد.</div><div id="teamEditors">${builder.teams.map(t=>`<div class="teamsection"><div class="row between"><h3>${t.key==='citizens'?'۱. تیم شهروندان':t.key==='mafia'?'۲. تیم مافیا':'۳. تیم مستقل'}</h3><span class="pill">${t.roles.length} نقش</span></div><div class="field"><label>نام این تیم (قابل تغییر)</label><input maxlength="40" value="${esc(t.name)}" oninput="S.teamName('${t.key}',this.value)"></div>${t.roles.map((r,i)=>roleEditor(t,i,r)).join('')}<button class="secondary" onclick="S.addRole('${t.key}')">＋ افزودن نقش به ${esc(t.name)}</button></div>`).join('')}</div><div id="builderValidation"></div><button style="width:100%;margin-top:12px" onclick="S.submitScenario()">ارسال برای بررسی مدیران · مصرف ۱ مجوز</button></div></div>`}
function mine(){if(!requireUser())return '';const u=me(),all=db.scenarios.filter(s=>s.authorId===u.id);return `<div class="page">${sectionHead('سناریوهای من','وضعیت همهٔ سناریوهایی که ساخته‌ای را ببین.','<button onclick="S.go(\'create\')">＋ سناریوی جدید</button>')}<div class="notice">مجوزهای باقی‌مانده: <b>${u.credits}</b>. در صورت رد شدن یک ارسال، مجوز همان ارسال برمی‌گردد.</div>${all.length?`<div class="panel"><div class="tablewrap"><table><thead><tr><th>نام سناریو</th><th>وضعیت</th><th>لایک</th><th>بازدید</th><th>عملیات</th></tr></thead><tbody>${all.map(s=>`<tr><td>${esc(s.title)}</td><td>${statusPill(s.status)}</td><td>${s.likes}</td><td>${s.views}</td><td><button class="secondary small" onclick="S.openScenario('${s.id}')">مشاهده</button> ${s.status==='rejected'?`<button class="small" onclick="S.editRejected('${s.id}')">ویرایش و ارسال مجدد</button>`:''} ${s.status==='approved'?`<button class="danger small" onclick="S.deleteScenario('${s.id}')">حذف</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`:'<div class="panel empty">هنوز سناریویی نساخته‌ای. اولین سناریوت رو بساز!</div>'}</div>`}
function statusPill(s){return s==='approved'?'<span class="pill good">منتشرشده</span>':s==='pending'?'<span class="pill wait">در انتظار بررسی</span>':s==='rejected'?'<span class="pill bad">ردشده</span>':`<span class="pill">${esc(s)}</span>`}
function shop(){const u=me();const packs=[{id:'license_1',count:1,price:30000,title:'تک‌مجوز',desc:'برای ساخت یک سناریوی تازه',featured:false},{id:'license_3',count:3,price:70000,title:'بسته سه‌تایی',desc:'صرفه‌جویی نسبت به خرید تکی',featured:true},{id:'license_10',count:10,price:200000,title:'بسته ده‌تایی',desc:'برای سناریوسازهای پرکار',featured:false}];return `<div class="page"><div class="sectionhead"><div><h2>فروشگاه مجوزهای سناریست</h2><p>مجوز برای ارسال سناریوی جدید استفاده می‌شود؛ اگر سناریو رد شود، مجوز مصرف‌شده برمی‌گردد.</p></div><span class="pill">موجودی: ${u?u.credits:'برای مشاهده موجودی وارد شو'}</span></div><div class="notice">پرداخت امن از طریق مایکت پس از اتصال نسخهٔ اندروید و سرور فعال می‌شود. این صفحه به‌تنهایی پرداخت انجام نمی‌دهد و مجوزی اضافه نمی‌کند.</div><div class="cards">${packs.map(p=>`<article class="panel" style="display:flex;flex-direction:column;gap:12px;"><div class="eyebrow">SENARIST LICENSE</div><h3 style="margin:0">${p.title}</h3><div style="font-size:30px;font-weight:800;color:var(--gold)">${p.price.toLocaleString('fa-IR')} <span style="font-size:13px">تومان</span></div><p class="muted">${p.desc}</p><div class="pill">${p.count.toLocaleString('fa-IR')} مجوز ساخت</div><button onclick="S.buyLicense('${p.id}')">خرید از مایکت</button></article>`).join('')}</div><div class="panel"><h3>راهنمای خرید</h3><p>۱. بسته را انتخاب کن. ۲. پرداخت در پنجرهٔ رسمی مایکت تأیید می‌شود. ۳. سرور سناریست رسید را بررسی می‌کند و فقط پس از تأیید، مجوزها را به حسابت اضافه می‌کند.</p><p class="tiny">قیمت‌ها: ۱ مجوز ۳۰٬۰۰۰ تومان · ۳ مجوز ۷۰٬۰۰۰ تومان · ۱۰ مجوز ۲۰۰٬۰۰۰ تومان</p></div></div>`}
function buyLicense(productId){const packs={license_1:{count:1,price:30000},license_3:{count:3,price:70000},license_10:{count:10,price:200000}};const p=packs[productId];if(!p)return toast('بستهٔ خرید معتبر نیست.');if(!me())return authModal('login');if(window.Android&&typeof window.Android.buyProduct==='function'){window.Android.buyProduct(productId);return toast('درخواست خرید به برنامه ارسال شد؛ تأیید نهایی باید از سرور انجام شود.')}toast('پرداخت واقعی هنوز وصل نیست: ابتدا Worker/API و پل پرداخت مایکت در نسخهٔ اندروید باید پیاده‌سازی شوند. این دکمه مجوز اضافه نمی‌کند.')}
function ranking(){const all=getPublished();const sorted=[...all].sort((a,b)=>((b.periodLikes||0)*5+(b.periodViews||0))-((a.periodLikes||0)*5+(a.periodViews||0)));return `<div class="page">${sectionHead('رتبه‌بندی ماهانه','هر لایک ۵ امتیاز و هر بازدید معتبر ۱ امتیاز دارد.')}<div class="panel"><div class="row between"><div><h3>جایزهٔ دوره</h3><div class="muted">نفر اول: <b style="color:var(--gold)">۳۰۰٬۰۰۰ تومان</b></div><div class="tiny">نفرات دوم و سوم معرفی می‌شوند.</div></div><span class="pill ${db.ranking.active?'good':'wait'}">${db.ranking.active?'دوره فعال':'رتبه‌بندی غیرفعال'}</span></div>${db.ranking.active?`<div class="notice good">دورهٔ شمارهٔ ${db.ranking.period} در حال اجراست؛ از ${date(db.ranking.startedAt)}.</div>`:'<div class="notice">در انتظار شروع دوره توسط مدیران. امتیازهای رقابتی تا شروع دوره ثبت نمی‌شوند.</div>'}</div><div class="panel"><h3>برترین سناریوها</h3>${sorted.length?sorted.map((s,i)=>`<div class="rankrow"><div class="ranknum">${i===0?'♛':i+1}</div><div><b>${esc(s.title)}</b><div class="tiny">${esc(s.authorName)} · ${s.periodLikes||0} لایک دوره · ${s.periodViews||0} بازدید دوره</div></div><div><b>${(s.periodLikes||0)*5+(s.periodViews||0)}</b><div class="tiny">امتیاز</div></div></div>`).join(''):'<div class="empty">هنوز سناریویی برای رتبه‌بندی وجود ندارد.</div>'}</div>${db.ranking.results.length?`<div class="panel"><h3>نتایج دوره‌های قبلی</h3>${db.ranking.results.map(r=>`<div class="rankrow"><div class="ranknum">🏆</div><div><b>دورهٔ ${r.period}</b><div class="tiny">برنده: ${esc(r.winner||'تعیین نشده')}</div></div><span class="pill">بایگانی‌شده</span></div>`).join('')}</div>`:''}</div>`}
function messages(){if(!requireUser())return '';const u=me();return `<div class="page">${sectionHead('پیام‌های سیستمی','اعلان‌های حساب و نتیجهٔ بررسی سناریوها.')}${u.messages.length?`<div class="panel">${[...u.messages].sort((a,b)=>b.date-a.date).map(m=>`<div class="rolebox"><div class="row between"><h3>${esc(m.title)}</h3><span class="pill ${m.read?'':'wait'}">${m.read?'خوانده‌شده':'جدید'}</span></div><p>${esc(m.body)}</p><div class="tiny">${date(m.date)}</div></div>`).join('')}</div>`:'<div class="panel empty">پیامی نداری.</div>'}</div>`}
function profile(){if(!me())return `<div class="page"><div class="auth panel"><h2>پروفایل و حساب کاربری</h2><p class="muted">برای دیدن پروفایل وارد شو.</p><button onclick="S.authModal('login')">ورود</button></div></div>`;const u=me();const ownScenarios=db.scenarios.filter(s=>s.authorId===u.id&&s.status==='approved');const followerCount=followersOf(u.id).length;return `<div class="page"><div class="grid2"><div class="panel"><h2>${u.forcePasswordChange?'تغییر رمز اولیه':'پروفایل من'}</h2>${u.forcePasswordChange?'<div class="notice warn">برای ادامه باید رمز اولیه را عوض کنی.</div>':''}<div class="profile-hero">${avatarHtml(u,76)}<div><h3 style="margin:0">${esc(u.displayName||'نام نمایشی انتخاب نشده')}</h3><div class="muted">${u.role==='owner'?'مدیر اصلی':u.role==='admin'?'مدیر منتخب':'سازندهٔ سناریو'}</div></div></div><div class="field"><label>شماره تلفن</label><input value="${esc(u.phone)}" disabled></div>${u.forcePasswordChange?`<div class="field"><label>رمز اولیه</label><input id="oldPass" type="password"></div><div class="field"><label>رمز جدید (حداقل ۶ نویسه)</label><input id="newPass" type="password"></div><button onclick="S.changePassword()">تغییر رمز و ادامه</button>`:`<div class="field"><label>نام نمایشی</label><input id="displayName" maxlength="30" value="${esc(u.displayName||'')}" placeholder="نامی که دیگران می‌بینند"></div><button onclick="S.saveProfile()">ذخیره نام نمایشی</button>`}<div class="notice">انتخاب آواتار با مجوزهای ساخت انجام می‌شود. سه آواتار اول رایگان‌اند؛ آواتارهای ویژه یک‌بار باز می‌شوند و بعد همیشه در دسترس می‌مانند.</div></div><div class="panel"><h2>آمار حساب</h2><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><strong>${u.credits}</strong><span>مجوز ساخت</span></div><div class="stat"><strong>${ownScenarios.length}</strong><span>سناریوی منتشرشده</span></div><div class="stat"><strong>${followerCount}</strong><span>دنبال‌کننده</span></div><div class="stat"><strong>${u.following.length}</strong><span>دنبال می‌کنی</span></div></div><div class="row"><button class="secondary" onclick="S.openProfile('${u.id}','following')">مشاهده دنبال‌شوندگان</button><button class="secondary" onclick="S.openProfile('${u.id}','followers')">مشاهده دنبال‌کنندگان</button></div><div class="field"><label>نقش حساب</label><input disabled value="${u.role==='owner'?'مدیر اصلی':u.role==='admin'?'مدیر منتخب':u.approved?'عضو تأییدشده':'در انتظار تأیید'}"></div></div></div><div class="panel"><div class="sectionhead"><div><h2>شخصی‌سازی آواتار</h2><p>سه آواتار رایگان و پنج آواتار ویژه؛ هزینهٔ ویژه‌ها از مجوزهای ساخت کم می‌شود.</p></div><span class="pill">موجودی: ${u.credits} مجوز</span></div><div class="avatar-choice-grid">${AVATARS.map(a=>{const unlocked=(u.unlockedAvatars||[]).includes(a.id),selected=u.avatarId===a.id;return `<div class="avatar-choice ${selected?'selected':''}">${avatarHtml({avatarId:a.id},56)}<b>${esc(a.name)}</b><small>${esc(a.desc)}</small><span class="tiny">${a.cost===0?'رایگان':a.cost+' مجوز'}</span>${selected?'<span class="pill good">انتخاب‌شده</span>':unlocked?`<button class="secondary small" onclick="S.selectAvatar('${a.id}')">انتخاب</button>`: `<button class="small" onclick="S.buyAvatar('${a.id}')">بازکردن</button>`}</div>`}).join('')}</div></div><div class="panel"><h2>سناریوهای منتشرشدهٔ من</h2>${ownScenarios.length?`<div class="cards">${ownScenarios.map(s=>`<article class="scenario"><div class="cover"><span class="tag">${s.players} بازیکن</span><div class="symbol">♟</div></div><div class="scenario-body"><h3>${esc(s.title)}</h3><p class="desc">${esc(s.description)}</p><button class="secondary small" onclick="S.openScenario('${s.id}')">مشاهدهٔ سناریو</button></div></article>`).join('')}</div>`:'<div class="empty">هنوز سناریویی منتشر نکرده‌ای.</div>'}</div></div>`}
function adminPage(){if(!isAdmin())return `<div class="page"><div class="panel"><h2>دسترسی محدود</h2><p>این بخش فقط برای مدیران است. برای ادامه، با حساب مدیر وارد شو.</p><button onclick="S.authModal('login')">ورود مدیر</button></div></div>`;let content='';if(adminTab==='overview'){content=`<div class="stats"><div class="stat"><strong>${db.requests.filter(r=>r.status==='pending').length}</strong><span>درخواست عضویت</span></div><div class="stat"><strong>${db.scenarios.filter(s=>s.status==='pending').length}</strong><span>سناریوی منتظر بررسی</span></div><div class="stat"><strong>${db.users.filter(u=>u.approved).length}</strong><span>حساب تأییدشده</span></div><div class="stat"><strong>${db.ranking.active?'فعال':'غیرفعال'}</strong><span>رتبه‌بندی</span></div></div><div class="panel"><h3>کارهای نیازمند رسیدگی</h3><p>درخواست‌های عضویت: <b>${db.requests.filter(r=>r.status==='pending').length}</b></p><p>سناریوهای در انتظار: <b>${db.scenarios.filter(s=>s.status==='pending').length}</b></p><div class="row"><button onclick="S.adminTab('requests')">بررسی عضویت‌ها</button><button class="secondary" onclick="S.adminTab('reviews')">بررسی سناریوها</button></div></div>`}else if(adminTab==='requests'){content=`<div class="panel"><h2>درخواست‌های عضویت</h2><p class="muted">با تأیید درخواست، رمز اولیه را تعیین کن و آن را به‌صورت امن در اختیار کاربر بگذار.</p>${db.requests.length?`<div class="tablewrap"><table><thead><tr><th>شماره</th><th>تاریخ</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>${db.requests.map(r=>`<tr><td>${esc(r.phone)}</td><td>${date(r.date)}</td><td>${statusPill(r.status==='pending'?'pending':r.status)}</td><td>${r.status==='pending'?`<button class="small" onclick="S.approveRequest('${r.id}')">تأیید و ساخت حساب</button> <button class="danger small" onclick="S.rejectRequest('${r.id}')">رد درخواست</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">درخواستی ثبت نشده.</div>'}</div><div class="panel"><h3>افزودن مستقیم حساب</h3><div class="grid2"><div class="field"><label>شماره تلفن</label><input id="newUserPhone" placeholder="09xxxxxxxxx"></div><div class="field"><label>رمز اولیه</label><input id="newUserPass" placeholder="حداقل ۶ نویسه"></div></div><button onclick="S.addUser()">ساخت حساب و اجبار به تغییر رمز</button></div>`}else if(adminTab==='reviews'){const pending=db.scenarios.filter(s=>s.status==='pending');content=`<div class="panel"><h2>بررسی سناریوها</h2>${pending.length?pending.map(s=>`<div class="rolebox"><div class="row between"><h3>${esc(s.title)}</h3><span class="pill wait">در انتظار بررسی</span></div><p class="muted">سازنده: ${esc(s.authorName)} · ${s.players} بازیکن</p><p>${esc(s.description)}</p>${s.teams.map(t=>`<div><b>${esc(t.name)} (${t.roles.length})</b><ul>${t.roles.map(r=>`<li>${esc(r.name)} — ${esc(r.description)}</li>`).join('')}</ul></div>`).join('')}<div class="row"><button class="good" onclick="S.approveScenario('${s.id}')">تأیید و انتشار</button><button class="danger" onclick="S.rejectScenario('${s.id}')">رد با ذکر دلیل</button><button class="secondary" onclick="S.adminEditScenario('${s.id}')">ویرایش</button></div></div>`).join(''):'<div class="empty">سناریویی برای بررسی وجود ندارد.</div>'}</div>`}else if(adminTab==='users'){content=`<div class="panel"><h2>کاربران و مجوزها</h2><div class="field"><input id="userSearch" placeholder="جست‌وجو با شماره یا نام…" oninput="S.filterUsers()"></div><div id="userResults">${usersTable(db.users)}</div></div><div class="panel"><h3>افزودن یا کم‌کردن مجوز</h3><div class="grid2"><div class="field"><label>شماره تلفن کاربر</label><input id="creditPhone" placeholder="09xxxxxxxxx"></div><div class="field"><label>تعداد مجوز (عدد مثبت یا منفی)</label><input id="creditAmount" type="number" value="1"></div></div><div class="field"><label>دلیل تغییر</label><input id="creditReason" placeholder="مثلاً پاداش مدیر"></div><button onclick="S.adjustCredits()">ثبت تغییر مجوز</button></div><div class="panel"><h3>مدیر منتخب</h3><div class="field"><label>شماره تلفن کاربر تأییدشده</label><input id="adminPhone" placeholder="09xxxxxxxxx"></div><button onclick="S.toggleAdmin()">تغییر سطح دسترسی مدیر</button></div>`}else if(adminTab==='featured'){const all=getPublished();content=`<div class="panel"><h2>مدیریت صفحهٔ اصلی</h2><p class="muted">حداکثر سه سناریو در هر بخش انتخاب کن.</p>${all.map(s=>`<div class="rolebox"><div class="row between"><div><b>${esc(s.title)}</b><div class="tiny">${esc(s.authorName)}</div></div><div class="row"><label><input style="width:auto" type="checkbox" ${s.featured?'checked':''} onchange="S.setFlag('${s.id}','featured',this.checked)"> منتخب</label><label><input style="width:auto" type="checkbox" ${s.adminChoice?'checked':''} onchange="S.setFlag('${s.id}','adminChoice',this.checked)"> انتخاب مدیران</label></div></div></div>`).join('')||'<div class="empty">سناریوی منتشرشده‌ای وجود ندارد.</div>'}</div>`}else if(adminTab==='ranking'){content=`<div class="panel"><h2>کنترل رتبه‌بندی ماهانه</h2><div class="notice ${db.ranking.active?'good':'warn'}">وضعیت: ${db.ranking.active?'دورهٔ شمارهٔ '+db.ranking.period+' فعال است':'غیرفعال'}</div><div class="row">${db.ranking.active?'<button class="danger" onclick="S.stopRanking()">توقف دوره</button>':'<button onclick="S.startRanking()">شروع دورهٔ جدید</button>'}<button class="secondary" onclick="S.publishResults()">تأیید و بایگانی نتیجه</button><button class="danger" onclick="S.resetRanking()">ریست کامل دوره</button></div><p class="muted">ریست فقط آمار رقابتی دوره را پاک می‌کند؛ لایک‌ها، بازدیدهای کل و سوابق بایگانی‌شده باقی می‌مانند.</p>${db.ranking.results.map(r=>`<div class="rolebox">دورهٔ ${r.period} · برنده: ${esc(r.winner||'تعیین نشده')} · ${date(r.date)}</div>`).join('')}</div>`}else if(adminTab==='messages'){content=`<div class="panel"><h2>ارسال پیام سیستمی</h2><div class="field"><label>گیرنده</label><select id="messageTarget"><option value="all">همهٔ کاربران تأییدشده</option>${db.users.filter(u=>u.approved).map(u=>`<option value="${u.id}">${esc(u.displayName||u.phone)} — ${esc(u.phone)}</option>`).join('')}</select></div><div class="field"><label>عنوان پیام</label><input id="messageTitle" placeholder="عنوان اطلاعیه"></div><div class="field"><label>متن پیام</label><textarea id="messageBody" placeholder="متن پیام…"></textarea></div><button onclick="S.sendMessage()">ارسال پیام سیستمی</button></div>`}else if(adminTab==='audit'){content=`<div class="panel"><h2>سابقهٔ عملیات</h2>${db.audit.length?`<div class="tablewrap"><table><thead><tr><th>تاریخ</th><th>مدیر/کاربر</th><th>عملیات</th><th>جزئیات</th></tr></thead><tbody>${[...db.audit].reverse().map(a=>`<tr><td>${date(a.date)}</td><td>${esc(a.actor)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">هنوز عملیاتی ثبت نشده.</div>'}</div>`}return `<div class="page"><div class="sectionhead"><div><h2>پنل مدیریت <span class="adminbadge">${isOwner()?'مدیر اصلی':'مدیر منتخب'}</span></h2><p>مدیریت اعضا، سناریوها، مجوزها و رقابت.</p></div></div><div class="tabs">${[['overview','نمای کلی'],['requests','عضویت‌ها'],['reviews','بررسی سناریو'],['users','کاربران و مجوزها'],['featured','صفحه اصلی'],['ranking','رتبه‌بندی'],['messages','پیام سیستمی'],['audit','سوابق']].map(([k,v])=>`<button class="${adminTab===k?'active':''}" onclick="S.adminTab('${k}')">${v}</button>`).join('')}</div>${content}</div>`}
function usersTable(users){return users.length?`<div class="tablewrap"><table><thead><tr><th>نام</th><th>شماره</th><th>نقش</th><th>مجوز</th><th>عملیات</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.displayName||'تکمیل نشده')}</td><td>${esc(u.phone)}</td><td>${u.role==='owner'?'مدیر اصلی':u.role==='admin'?'مدیر منتخب':u.approved?'عضو':'غیرفعال'}</td><td>${u.credits}</td><td><button class="secondary small" onclick="S.quickCredits('${u.id}')">تغییر مجوز</button> ${u.role!=='owner'?`<button class="danger small" onclick="S.blockUser('${u.id}')">${u.approved?'مسدود':'فعال‌سازی'}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">کاربری پیدا نشد.</div>'}
function render(){updateHeader();const app=document.getElementById('app');let html='';switch(page){case'home':html=home();break;case'discover':html=discover();break;case'create':html=createPage();break;case'shop':html=shop();break;case'mine':html=mine();break;case'ranking':html=ranking();break;case'messages':html=messages();break;case'profile':html=profile();break;case'admin':html=adminPage();break;default:html=home()}app.innerHTML=html;if(page==='create')validateBuilder()}
function authModal(mode){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modalback" onclick="if(event.target===this)S.closeModal()"><div class="modal"><div class="modalhead"><h2>${mode==='login'?'ورود به سناریست':'درخواست عضویت'}</h2><button class="xbtn" onclick="S.closeModal()">✕</button></div><div class="tabs"><button class="${mode==='login'?'active':''}" onclick="S.authModal('login')">ورود</button><button class="${mode==='register'?'active':''}" onclick="S.authModal('register')">درخواست عضویت</button></div>${mode==='login'?`<div class="field"><label>شماره تلفن</label><input id="authPhone" placeholder="مثلاً 09120000000" autocomplete="tel"></div><div class="field"><label>رمز عبور</label><input id="authPass" type="password" placeholder="رمز عبور" onkeydown="if(event.key==='Enter')S.login()"></div><div class="notice">برای ورود به پنل مدیریت، اطلاعات حساب مدیر را وارد کن.</div><button style="width:100%" onclick="S.login()">ورود</button>`:`<div class="field"><label>شماره تلفن</label><input id="regPhone" placeholder="شماره موبایل خودت"></div><div class="notice">درخواست عضویت پس از بررسی مدیران تأیید یا رد می‌شود. در صورت تأیید، اطلاعات ورود از طرف مدیریت در اختیارت قرار می‌گیرد.</div><button style="width:100%" onclick="S.register()">ثبت درخواست عضویت</button>`}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function log(action,detail){db.audit.push({date:Date.now(),actor:me()?.displayName||'سیستم',action,detail});save()}
function login(){const phone=document.getElementById('authPhone')?.value.trim(),pass=document.getElementById('authPass')?.value;if(!phone||!pass)return toast('شماره تلفن و رمز را وارد کن.');const u=db.users.find(x=>x.phone===phone&&x.password===pass&&x.approved);if(!u){const req=db.requests.find(r=>r.phone===phone&&r.status==='pending');return toast(req?'درخواستت هنوز در انتظار بررسی است.':'اطلاعات ورود نادرست است یا حساب تأیید نشده.')}db.currentUser=u.id;closeModal();save();if(u.forcePasswordChange){go('profile');toast('ابتدا رمز اولیه را تغییر بده.')}else if(!u.displayName){go('profile');toast('برای شروع نام نمایشی انتخاب کن.')}else{go('home');toast('خوش اومدی به سناریست!')}}
function register(){const phone=document.getElementById('regPhone')?.value.trim();if(!/^09\d{9}$/.test(phone||''))return toast('شماره باید ۱۱ رقم و با 09 شروع شود.');if(db.users.some(u=>u.phone===phone)||db.requests.some(r=>r.phone===phone&&r.status==='pending'))return toast('برای این شماره قبلاً حساب یا درخواست ثبت شده.');db.requests.push({id:id('req'),phone,date:Date.now(),status:'pending'});save();closeModal();toast('درخواست عضویت ثبت شد؛ بررسی ممکن است ۲ تا ۳ روز طول بکشد.');if(isAdmin())go('admin')}
function approveRequest(rid){const r=db.requests.find(x=>x.id===rid);if(!r)return;const pass=prompt('رمز اولیه را برای این کاربر تعیین کن (حداقل ۶ نویسه):');if(!pass||pass.length<6)return toast('رمز اولیه باید حداقل ۶ نویسه باشد.');if(db.users.some(u=>u.phone===r.phone))return toast('برای این شماره حساب وجود دارد.');db.users.push({id:id('u'),phone:r.phone,password:pass,displayName:'',role:'user',approved:true,forcePasswordChange:true,createdAt:Date.now(),credits:3,likesEarned:0,followers:0,avatarId:'free_shadow',unlockedAvatars:['free_shadow','free_mask','free_owl'],following:[],liked:[],viewed:[],messages:[{id:id('msg'),title:'حساب شما تأیید شد',body:'رمز اولیه را از مدیر دریافت کن؛ پس از ورود رمزت را تغییر بده و نام نمایشی انتخاب کن.',date:Date.now(),read:false}]});r.status='approved';log('تأیید عضویت',r.phone);render();toast('حساب ساخته شد. رمز اولیه را خارج از سایت به کاربر بده.')}
function rejectRequest(rid){const r=db.requests.find(x=>x.id===rid);if(!r)return;r.status='rejected';log('رد درخواست عضویت',r.phone);render();toast('درخواست رد شد.')}
function addUser(){const phone=document.getElementById('newUserPhone')?.value.trim(),pass=document.getElementById('newUserPass')?.value;if(!/^09\d{9}$/.test(phone||'')||!pass||pass.length<6)return toast('شماره معتبر و رمز حداقل ۶ نویسه وارد کن.');if(db.users.some(u=>u.phone===phone))return toast('این شماره حساب دارد.');db.users.push({id:id('u'),phone,password:pass,displayName:'',role:'user',approved:true,forcePasswordChange:true,createdAt:Date.now(),credits:3,likesEarned:0,followers:0,avatarId:'free_shadow',unlockedAvatars:['free_shadow','free_mask','free_owl'],following:[],liked:[],viewed:[],messages:[]});log('ساخت حساب مستقیم',phone);render();toast('حساب ساخته شد؛ رمز اولیه را به کاربر بده.')}
function changePassword(){const u=me(),old=document.getElementById('oldPass')?.value,pass=document.getElementById('newPass')?.value;if(!u||old!==u.password)return toast('رمز اولیه درست نیست.');if(!pass||pass.length<6)return toast('رمز جدید باید حداقل ۶ نویسه باشد.');u.password=pass;u.forcePasswordChange=false;save();render();toast('رمز عوض شد؛ حالا نام نمایشی را انتخاب کن.')}
function saveProfile(){const u=me(),name=document.getElementById('displayName')?.value.trim();if(!u||!name)return toast('نام نمایشی را وارد کن.');if(name.length<2||name.length>30)return toast('نام نمایشی باید بین ۲ تا ۳۰ نویسه باشد.');if(db.users.some(x=>x.id!==u.id&&x.displayName.toLowerCase()===name.toLowerCase()))return toast('این نام نمایشی قبلاً انتخاب شده.');u.displayName=name;save();render();toast('پروفایل ذخیره شد.')}
function builderTitle(v){builder.title=v}function builderDesc(v){builder.description=v}function builderPlayers(v){builder.players=Number(v);validateBuilder()}function teamName(k,v){const t=builder.teams.find(t=>t.key===k);if(t)t.name=v;const lab=document.querySelector(`#teamEditors .teamsection`);validateBuilder()}
function addRole(k){const t=builder.teams.find(t=>t.key===k);if(t)t.roles.push({name:'',description:''});render()}
function removeRole(k,i){const t=builder.teams.find(t=>t.key===k);if(t)t.roles.splice(i,1);render()}
function roleChange(k,i,key,v){const t=builder.teams.find(t=>t.key===k);if(t&&t.roles[i])t.roles[i][key]=v;validateBuilder()}
function validateBuilder(){const el=document.getElementById('builderValidation');if(!el)return;const c=builder.teams[0].roles.length,m=builder.teams[1].roles.length,ind=builder.teams[2].roles.length,total=c+m+ind,errors=[];if(!builder.title.trim())errors.push('نام سناریو را وارد کن.');if(!builder.teams.every(t=>t.name.trim()))errors.push('نام هر سه تیم باید مشخص باشد.');if(total!==builder.players)errors.push(`تعداد نقش‌ها (${total}) باید دقیقاً برابر تعداد بازیکنان (${builder.players}) باشد.`);if(m>=c)errors.push('تعداد نقش‌های مافیا باید کمتر از نقش‌های شهروندان باشد.');if(ind>2)errors.push('حداکثر دو نقش مستقل مجاز است.');if(ind<0)errors.push('تعداد نقش‌های مستقل معتبر نیست.');builder.teams.forEach(t=>t.roles.forEach((r,i)=>{if(!r.name.trim())errors.push(`نام نقش ${i+1} در تیم «${t.name}» خالی است.`);if(!r.description.trim())errors.push(`توضیحات نقش «${r.name||'بدون نام'}» را تکمیل کن.`)}));el.innerHTML=`<div class="notice ${errors.length?'warn':'good'}"><b>${errors.length?'نیازمند اصلاح':'آمادهٔ ارسال از نظر قوانین فرم'}</b><ul>${(errors.length?errors:['همهٔ نقش‌ها نام و توضیحات دارند و تعدادها درست است.']).slice(0,8).map(e=>`<li>${esc(e)}</li>`).join('')}</ul><div class="tiny">شهروندان: ${c} · مافیا: ${m} · مستقل: ${ind} · مجموع: ${total}/${builder.players}</div></div>`;return errors}
function submitScenario(){const u=me();if(!u)return authModal('login');const errors=validateBuilder();if(errors.length)return toast('اول خطاهای فرم را برطرف کن.');if(u.credits<1)return toast('مجوز ساخت کافی نداری.');if(!confirm('مطمئنی می‌خواهی سناریو را برای بررسی بفرستی؟ یک مجوز مصرف می‌شود و در صورت رد، برمی‌گردد.'))return;u.credits--;const s={id:id('s'),title:builder.title.trim(),description:builder.description.trim(),authorId:u.id,authorName:u.displayName,players:builder.players,teams:JSON.parse(JSON.stringify(builder.teams)),status:'pending',likes:0,views:0,periodLikes:0,periodViews:0,createdAt:Date.now(),featured:false,adminChoice:false,revision:1};db.scenarios.push(s);log('ارسال سناریو',s.title+'؛ مجوز مصرف شد');builder={title:'',description:'',players:10,teams:[{key:'citizens',name:'شهروندان',roles:[]},{key:'mafia',name:'مافیا',roles:[]},{key:'independent',name:'مستقل',roles:[]}]};save();go('mine');toast('سناریو ارسال شد و در انتظار بررسی مدیر است.')}
function like(sid){if(!requireUser())return;const u=me(),s=scenarioById(sid);if(!s||s.status!=='approved')return;if(u.liked.includes(sid)){u.liked=u.liked.filter(x=>x!==sid);s.likes=Math.max(0,s.likes-1);if(db.ranking.active)s.periodLikes=Math.max(0,(s.periodLikes||0)-1);toast('لایک برداشته شد.')}else{u.liked.push(sid);s.likes++;if(db.ranking.active)s.periodLikes=(s.periodLikes||0)+1;awardThresholds(s.authorId);toast('لایک ثبت شد؛ ممنون از حمایتت!')}save();render()}
function awardThresholds(uid){const u=db.users.find(x=>x.id===uid);if(!u)return;const totalLikes=db.scenarios.filter(s=>s.authorId===uid).reduce((n,s)=>n+s.likes,0);const likeAward=Math.floor(totalLikes/10);const followAward=Math.floor((u.followers||0)/20);const ledger= db.ledger||(db.ledger=[]);const oldLike=ledger.filter(l=>l.uid===uid&&l.type==='like').length,oldFollow=ledger.filter(l=>l.uid===uid&&l.type==='follow').length;for(let i=oldLike;i<likeAward;i++){u.credits++;ledger.push({uid,type:'like',at:Date.now()});}for(let i=oldFollow;i<followAward;i++){u.credits++;ledger.push({uid,type:'follow',at:Date.now()});}}
function openScenario(sid,activeTeam){const s=scenarioById(sid);if(!s)return;const u=me();if(u&&!u.viewed.includes(sid)){u.viewed.push(sid);s.views=(s.views||0)+1;if(db.ranking.active)s.periodViews=(s.periodViews||0)+1;save()}const author=db.users.find(x=>x.id===s.authorId)||{id:s.authorId,displayName:s.authorName,avatarId:'free_shadow',following:[],credits:0,followers:0};const canFollow=u&&u.id!==s.authorId;const following=u&&u.following.includes(s.authorId);const teams=s.teams.filter(t=>t.key!=='independent'||t.roles.length>0);const active=teams.find(t=>t.key===activeTeam)||teams[0];document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)S.closeModal()"><div class="modal" style="width:min(920px,100%)"><div class="modalhead"><h2>جزئیات سناریو</h2><button class="xbtn" onclick="S.closeModal()">✕</button></div><div class="scenario-detail-hero"><span class="pill">${s.players} بازیکن · ${s.teams.reduce((n,t)=>n+t.roles.length,0)} نقش</span><h2>${esc(s.title)}</h2><p style="max-width:700px;color:#d0deef">${esc(s.description||'معرفی‌ای برای این سناریو ثبت نشده است.')}</p><div class="row"><span class="pill">♡ ${s.likes||0} لایک</span><span class="pill">◉ ${s.views||0} بازدید</span><span class="pill">منتشرشده در ${date(s.publishedAt||s.createdAt)}</span></div></div><div class="scenario-author-panel"><button class="author-chip" onclick="S.openProfile('${author.id}')">${avatarHtml(author,54)}<span><b>${esc(author.displayName||s.authorName||'سازنده')}</b><br><span class="tiny">ناشر سناریو · مشاهدهٔ پروفایل</span></span></button><div class="row">${canFollow?`<button class="secondary" onclick="S.follow('${author.id}')">${following?'✓ دنبال می‌کنی':'＋ دنبال‌کردن'}</button>`:''}${s.status==='approved'?`<button class="likebtn ${u&&u.liked.includes(sid)?'liked':''}" onclick="S.like('${sid}')">${u&&u.liked.includes(sid)?'♥ لایک‌شده':'♡ لایک سناریو'}</button>`:''}</div><div class="row"><button class="profile-link" onclick="S.openProfile('${author.id}','following')">دنبال‌شوندگان: ${author.following?.length||0}</button><button class="profile-link" onclick="S.openProfile('${author.id}','followers')">دنبال‌کنندگان: ${followersOf(author.id).length}</button></div></div><h3 style="margin:18px 0 6px">نقش‌ها و آموزش‌ها</h3><p class="muted">برای دیدن توضیحات کامل هر نقش، روی «آموزش نقش» بزن.</p><div class="team-tabs">${teams.map(t=>`<button class="${active&&active.key===t.key?'active':''}" onclick="S.openScenario('${sid}','${t.key}')">${esc(t.name)} <span class="tiny">(${t.roles.length})</span></button>`).join('')}</div><div class="teamsection" style="margin-top:0"><div class="row between"><h3 style="margin:0">${esc(active?.name||'نقش‌ها')}</h3><span class="pill">${active?.roles.length||0} نقش</span></div>${active&&active.roles.length?active.roles.map((r,i)=>`<div class="compact-role"><div class="role-titleline"><span class="role-mark">${['♟','◈','✦','⚖','⌖','♜'][i%6]}</span><div><b>${esc(r.name)}</b><div class="tiny">آموزش و توانایی نقش</div></div></div><button class="secondary small" onclick="S.toggleRoleGuide('${sid}','${active.key}',${i})">▤ آموزش نقش</button></div><div class="role-guide hidden" id="guide-${sid}-${active.key}-${i}"><b>آموزش نقش: ${esc(r.name)}</b><p>${esc(r.description||'برای این نقش توضیحی ثبت نشده است.')}</p></div>`).join(''):'<div class="empty">برای این تیم هنوز نقشی ثبت نشده است.</div>'}</div><div class="row" style="margin-top:14px">${isAdmin()?`<button class="secondary" onclick="S.adminEditScenario('${sid}')">ویرایش مدیر</button>${s.status==='approved'?`<button class="danger" onclick="S.adminUnpublish('${sid}')">خروج از انتشار</button>`:''}`:''}</div></div></div>`}
function toggleRoleGuide(sid,key,index){const el=document.getElementById(`guide-${sid}-${key}-${index}`);if(el)el.classList.toggle('hidden')}
function openProfile(uid,tab='scenarios'){const target=db.users.find(x=>x.id===uid);if(!target)return;const current=me(),isSelf=current&&current.id===uid,followers=followersOf(uid),following=target.following.map(id=>db.users.find(x=>x.id===id)).filter(Boolean),scenarios=db.scenarios.filter(s=>s.authorId===uid&&s.status==='approved'),isFollowing=current&&(current.following||[]).includes(uid);let listing='';if(tab==='followers'||tab==='following'){const people=tab==='followers'?followers:following;listing=`<div class="panel" style="margin-top:14px"><h3>${tab==='followers'?'دنبال‌کنندگان':'دنبال‌شوندگان'} (${people.length})</h3>${people.length?people.map(p=>`<div class="person-row"><button class="author-chip" style="border:0;background:transparent;padding:0" onclick="S.openProfile('${p.id}')">${avatarHtml(p,40)}<span>${esc(p.displayName||'کاربر')}</span></button>${current&&current.id!==p.id?`<button class="secondary small" onclick="S.follow('${p.id}')">${current.following.includes(p.id)?'دنبال می‌کنی':'دنبال‌کردن'}</button>`:''}</div>`).join(''):'<div class="empty">این فهرست هنوز خالی است.</div>'}</div>`}else{listing=`<div class="panel" style="margin-top:14px"><h3>سناریوهای منتشرشده (${scenarios.length})</h3>${scenarios.length?scenarios.map(s=>`<div class="person-row"><div><b>${esc(s.title)}</b><div class="tiny">${s.players} بازیکن · ${s.likes||0} لایک · ${s.views||0} بازدید</div></div><button class="secondary small" onclick="S.openScenario('${s.id}')">مشاهده</button></div>`).join(''):'<div class="empty">هنوز سناریویی منتشر نشده است.</div>'}</div>`}document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)S.closeModal()"><div class="modal"><div class="modalhead"><h2>پروفایل کاربر</h2><button class="xbtn" onclick="S.closeModal()">✕</button></div><div class="profile-hero">${avatarHtml(target,76)}<div style="flex:1"><h2 style="margin:0">${esc(target.displayName||'کاربر')}</h2><div class="muted">${target.role==='owner'?'مدیر اصلی':target.role==='admin'?'مدیر منتخب':'سازندهٔ سناریو'}</div><div class="tiny">عضویت از ${date(target.createdAt)}</div></div></div><div class="row" style="margin-top:13px">${!isSelf&&current?`<button onclick="S.follow('${uid}')">${isFollowing?'✓ دنبال می‌کنی · لغو':'＋ دنبال‌کردن'}</button>`:''}<button class="profile-link" onclick="S.openProfile('${uid}','scenarios')">سناریوها (${scenarios.length})</button><button class="profile-link" onclick="S.openProfile('${uid}','following')">دنبال‌شوندگان (${following.length})</button><button class="profile-link" onclick="S.openProfile('${uid}','followers')">دنبال‌کنندگان (${followers.length})</button></div>${listing}</div></div>`}
function follow(uid){if(!requireUser())return;const u=me(),target=db.users.find(x=>x.id===uid);if(!target||uid===u.id)return;if(u.following.includes(uid)){u.following=u.following.filter(x=>x!==uid);target.followers=Math.max(0,(target.followers||0)-1);toast('دنبال‌کردن لغو شد.')}else{u.following.push(uid);target.followers=(target.followers||0)+1;awardThresholds(uid);toast('اکنون این سازنده را دنبال می‌کنی.')}save();closeModal();render()}

function selectAvatar(aid){const u=me(),a=AVATARS.find(x=>x.id===aid);if(!u||!a)return;if(!(u.unlockedAvatars||[]).includes(aid))return toast('ابتدا این آواتار را باز کن.');u.avatarId=aid;save();render();toast('آواتار انتخاب شد.')}
function buyAvatar(aid){const u=me(),a=AVATARS.find(x=>x.id===aid);if(!u||!a)return;if((u.unlockedAvatars||[]).includes(aid))return selectAvatar(aid);if(u.credits<a.cost)return toast(`برای این آواتار ${a.cost} مجوز لازم داری.`);if(!confirm(`آواتار «${a.name}» را با ${a.cost} مجوز باز کنی؟`))return;u.credits-=a.cost;u.unlockedAvatars.push(aid);u.avatarId=aid;db.ledger=db.ledger||[];db.ledger.push({uid:u.id,type:'avatar_purchase',amount:-a.cost,reason:'بازکردن آواتار '+a.name,at:Date.now()});log('خرید آواتار',a.name+'؛ هزینه '+a.cost+' مجوز');save();render();toast('آواتار باز شد و انتخاب شد!')}

function deleteScenario(sid){const s=scenarioById(sid);if(!s||s.authorId!==me()?.id)return;if(!confirm('سناریو حذف شود؟ این کار قابل بازگشت نیست.'))return;db.scenarios=db.scenarios.filter(x=>x.id!==sid);db.users.forEach(u=>{u.liked=u.liked.filter(x=>x!==sid);u.viewed=u.viewed.filter(x=>x!==sid)});log('حذف سناریو توسط سازنده',s.title);save();render();toast('سناریو حذف شد.')}
function editRejected(sid){const s=scenarioById(sid);if(!s||s.authorId!==me()?.id||s.status!=='rejected')return;builder={title:s.title,description:s.description,players:s.players,teams:JSON.parse(JSON.stringify(s.teams))};s.status='draft';save();go('create');toast('سناریو برای ویرایش در فرم بارگذاری شد؛ پس از اصلاح دوباره ارسالش کن.')}
function approveScenario(sid){const s=scenarioById(sid);if(!s||s.status!=='pending')return;s.status='approved';s.publishedAt=Date.now();const u=db.users.find(x=>x.id===s.authorId);if(u)u.messages.unshift({id:id('msg'),title:'سناریوت منتشر شد!',body:`سناریوی «${s.title}» تأیید و بلافاصله منتشر شد.`,date:Date.now(),read:false});log('تأیید سناریو',s.title);save();render();toast('سناریو منتشر شد.')}
function rejectScenario(sid){const s=scenarioById(sid);if(!s||s.status!=='pending')return;const reason=prompt('دلیل رد سناریو را بنویس:');if(!reason||!reason.trim())return toast('برای رد سناریو باید دلیل ثبت شود.');s.status='rejected';s.rejectionReason=reason.trim();const u=db.users.find(x=>x.id===s.authorId);if(u){u.credits++;u.messages.unshift({id:id('msg'),title:'سناریو نیاز به اصلاح دارد',body:`سناریوی «${s.title}» رد شد. دلیل مدیر: ${reason.trim()} یک مجوز به حسابت برگشت. می‌توانی سناریو را ویرایش و دوباره ارسال کنی.`,date:Date.now(),read:false})}log('رد سناریو',s.title+'؛ '+reason.trim());save();render();toast('سناریو رد شد و مجوز بازگشت.')}
function adminEditScenario(sid){const s=scenarioById(sid);if(!isAdmin()||!s)return;closeModal();document.getElementById('modalRoot').innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><h2>ویرایش مدیریتی: ${esc(s.title)}</h2><button class="xbtn" onclick="S.closeModal()">✕</button></div><div class="field"><label>نام سناریو</label><input id="admTitle" value="${esc(s.title)}"></div><div class="field"><label>توضیحات</label><textarea id="admDesc">${esc(s.description)}</textarea></div><div class="field"><label>وضعیت</label><select id="admStatus"><option value="approved" ${s.status==='approved'?'selected':''}>منتشرشده</option><option value="pending" ${s.status==='pending'?'selected':''}>در انتظار بررسی</option><option value="rejected" ${s.status==='rejected'?'selected':''}>ردشده</option></select></div><button onclick="S.saveAdminEdit('${sid}')">ذخیره تغییرات</button> <button class="danger" onclick="S.adminDeleteScenario('${sid}')">حذف سناریو</button></div></div>`}
function saveAdminEdit(sid){const s=scenarioById(sid);if(!s)return;s.title=document.getElementById('admTitle').value.trim()||s.title;s.description=document.getElementById('admDesc').value.trim();s.status=document.getElementById('admStatus').value;log('ویرایش مدیریتی سناریو',s.title);save();closeModal();render();toast('تغییرات ذخیره شد.')}
function adminDeleteScenario(sid){if(!isAdmin())return;const s=scenarioById(sid);if(!s||!confirm('سناریو برای همیشه حذف شود؟'))return;db.scenarios=db.scenarios.filter(x=>x.id!==sid);log('حذف سناریو توسط مدیر',s.title);save();closeModal();render();toast('سناریو حذف شد.')}
function adminUnpublish(sid){const s=scenarioById(sid);if(!isAdmin()||!s)return;if(!confirm('سناریو از انتشار خارج شود؟'))return;s.status='rejected';s.rejectionReason='از انتشار توسط مدیر خارج شد.';const u=db.users.find(x=>x.id===s.authorId);if(u)u.messages.unshift({id:id('msg'),title:'سناریو از انتشار خارج شد',body:`سناریوی «${s.title}» توسط مدیر از انتشار خارج شد.`,date:Date.now(),read:false});log('خروج از انتشار',s.title);save();closeModal();render();toast('سناریو از انتشار خارج شد.')}
function setFlag(sid,key,val){const s=scenarioById(sid);if(!s)return;if(val&&db.scenarios.filter(x=>x.status==='approved'&&x[key]&&x.id!==sid).length>=3){toast('برای هر بخش حداکثر سه سناریو انتخاب کن.');render();return}s[key]=val;log('تغییر صفحه اصلی',s.title+'؛ '+key+'='+val);save();render()}
function startRanking(){if(!isAdmin()||db.ranking.active)return;if(!confirm('دورهٔ جدید رتبه‌بندی شروع شود؟'))return;db.ranking.active=true;db.ranking.period++;db.ranking.startedAt=Date.now();db.ranking.stoppedAt=null;db.scenarios.forEach(s=>{s.periodLikes=0;s.periodViews=0});log('شروع رتبه‌بندی','دوره '+db.ranking.period);save();render();toast('رتبه‌بندی شروع شد.')}
function stopRanking(){if(!isAdmin()||!db.ranking.active)return;if(!confirm('رتبه‌بندی متوقف شود؟ نتیجه برای تأیید آماده می‌شود.'))return;db.ranking.active=false;db.ranking.stoppedAt=Date.now();log('توقف رتبه‌بندی','دوره '+db.ranking.period);save();render();toast('دوره متوقف شد.')}
function publishResults(){if(!isAdmin()||db.ranking.active)return toast('ابتدا دوره را متوقف کن.');const all=getPublished().sort((a,b)=>((b.periodLikes||0)*5+(b.periodViews||0))-((a.periodLikes||0)*5+(a.periodViews||0)));if(!all.length)return toast('سناریویی برای رتبه‌بندی وجود ندارد.');if(!confirm(`نتیجهٔ دورهٔ ${db.ranking.period} تأیید شود؟ برنده: ${all[0].authorName} با سناریوی ${all[0].title}.`))return;db.ranking.results.push({period:db.ranking.period,winner:all[0].authorName,scenario:all[0].title,date:Date.now()});log('تأیید نتیجه رتبه‌بندی',all[0].authorName);save();render();toast('نتیجهٔ رتبه‌بندی با موفقیت بایگانی شد.')}
function resetRanking(){if(!isOwner())return toast('فقط مدیر اصلی می‌تواند رتبه‌بندی را ریست کند.');if(db.ranking.active)return toast('ابتدا دوره را متوقف کن.');if(!confirm('آمار رقابتی دوره پاک شود؟ سوابق بایگانی‌شده باقی می‌مانند.'))return;db.scenarios.forEach(s=>{s.periodLikes=0;s.periodViews=0});db.ranking.startedAt=null;db.ranking.stoppedAt=null;log('ریست رتبه‌بندی','آمار رقابتی پاک شد');save();render();toast('آمار دوره ریست شد.')}
function adjustCredits(){const phone=document.getElementById('creditPhone')?.value.trim(),n=Number(document.getElementById('creditAmount')?.value),reason=document.getElementById('creditReason')?.value.trim()||'تغییر مدیریتی';const u=db.users.find(x=>x.phone===phone);if(!u||!Number.isInteger(n)||n===0)return toast('کاربر و تعداد مجوز معتبر وارد کن.');if(u.credits+n<0)return toast('موجودی مجوز نمی‌تواند منفی شود.');u.credits+=n;db.ledger=db.ledger||[];db.ledger.push({uid:u.id,type:'admin',amount:n,reason,at:Date.now()});log('تغییر مجوز',phone+'؛ '+n+'؛ '+reason);save();render();toast('مجوزها به‌روزرسانی شد.')}
function quickCredits(uid){const u=db.users.find(x=>x.id===uid);if(!u)return;const n=Number(prompt('تعداد مجوز برای اضافه/کم کردن (مثلاً 2 یا -1):','1'));if(!Number.isInteger(n)||n===0)return;if(u.credits+n<0)return toast('موجودی منفی نمی‌شود.');u.credits+=n;log('تغییر سریع مجوز',u.phone+'؛ '+n);save();render();toast('مجوز به‌روزرسانی شد.')}
function toggleAdmin(){if(!isOwner())return toast('فقط مدیر اصلی می‌تواند مدیر منتخب تعیین کند.');const phone=document.getElementById('adminPhone')?.value.trim(),u=db.users.find(x=>x.phone===phone);if(!u||u.role==='owner')return toast('کاربر معتبر پیدا نشد.');u.role=u.role==='admin'?'user':'admin';log('تغییر سطح دسترسی',phone+'؛ '+u.role);save();render();toast('سطح دسترسی تغییر کرد.')}
function blockUser(uid){if(!isOwner())return toast('فقط مدیر اصلی اجازه دارد.');const u=db.users.find(x=>x.id===uid);if(!u||u.role==='owner')return;u.approved=!u.approved;log(u.approved?'فعال‌سازی حساب':'مسدودسازی حساب',u.phone);save();render()}
function filterUsers(){const q=(document.getElementById('userSearch')?.value||'').toLowerCase();const el=document.getElementById('userResults');if(el)el.innerHTML=usersTable(db.users.filter(u=>u.phone.includes(q)||(u.displayName||'').toLowerCase().includes(q)))}
function filterScenarios(){const q=(document.getElementById('searchScenarios')?.value||'').toLowerCase();const arr=getPublished().filter(s=>(s.title+' '+s.authorName+' '+s.description+' '+s.teams.flatMap(t=>[t.name,...t.roles.map(r=>r.name)]).join(' ')).toLowerCase().includes(q));const el=document.getElementById('scenarioResults');if(el)el.innerHTML=cardsList(arr,'نتیجه‌ای پیدا نشد.')}
function sendMessage(){if(!isAdmin())return;const target=document.getElementById('messageTarget').value,title=document.getElementById('messageTitle').value.trim(),body=document.getElementById('messageBody').value.trim();if(!title||!body)return toast('عنوان و متن پیام را وارد کن.');const targets=target==='all'?db.users.filter(u=>u.approved):db.users.filter(u=>u.id===target);targets.forEach(u=>u.messages.unshift({id:id('msg'),title,body,date:Date.now(),read:false}));log('ارسال پیام سیستمی',title+'؛ تعداد گیرنده: '+targets.length);save();render();toast('پیام سیستمی ارسال شد.')}
function adminTabFn(t){adminTab=t;render()}

window.S={go,buyLicense,authModal,closeModal,login,register,approveRequest,rejectRequest,addUser,changePassword,saveProfile,builderTitle,builderDesc,builderPlayers,teamName,addRole,removeRole,roleChange,submitScenario,like,openScenario,openProfile,toggleRoleGuide,selectAvatar,buyAvatar,follow,deleteScenario,editRejected,approveScenario,rejectScenario,adminEditScenario,saveAdminEdit,adminDeleteScenario,adminUnpublish,setFlag,startRanking,stopRanking,publishResults,resetRanking,adjustCredits,quickCredits,toggleAdmin,blockUser,filterUsers,filterScenarios,sendMessage,adminTab:adminTabFn};
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));document.getElementById('authButton').addEventListener('click',()=>{if(me()){db.currentUser=null;save();go('home');toast('از حساب خارج شدی.')}else authModal('login')});
updateHeader();render();
})();
</script></body></html>
